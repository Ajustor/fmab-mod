plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Le workflow de release passe le tag (v1.2.3, v1.2.3-beta) en -PreleaseVersion ; le « v » est
// retiré. Sans tag, on garde la version de développement de gradle.properties.
def releaseVersion = (findProperty('releaseVersion') ?: '').toString().replaceFirst(/^v/, '')
version = "${releaseVersion ?: project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fmab" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Les tests lisent les JSON de glyphes et les fichiers de langue directement dans le dépôt,
	// les mêmes que ceux que l'éditeur web publiera.
	systemProperty 'fmab.resources', file('src/main/resources').absolutePath
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
