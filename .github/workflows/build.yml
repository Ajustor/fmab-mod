# Build du mod à chaque pull request et à chaque push sur master (ou à la demande) : compilation,
# tests (parseur de cercles, règles, clés fr_fr/en_us, exemples du Traité), puis les jars du mod
# (un par loader et par version de Minecraft) en artefact téléchargeable, nommé d'après la version
# et le commit. Les textures sont vérifiées :
# les régénérer ne doit rien changer. La release au tag est dans release.yml.
name: build
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le build devenu inutile.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          # Tout l'historique et les tags : la version du jar en dépend.
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: name the jars
        id: jar
        run: |
          mkdir -p jars
          for jar in build/libs/fmab-*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            cp "$jar" jars/
          done
          version=$(ls jars | head -n 1 | sed -E 's/^fmab-[a-z]+-([^+]+)\+.*/\1/')
          name=fmab-$version-${GITHUB_SHA::7}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Jars du mod"
            echo
            echo "Commit \`${GITHUB_SHA::7}\`, artefact **$name** ci-dessous : prendre le jar de sa version de"
            echo "Minecraft et de son loader, à poser dans \`mods/\`."
            echo
            for jar in jars/*.jar; do echo "- \`$(basename "$jar")\` ($(du -h "$jar" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the mod jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar.outputs.name }}
          path: jars/*.jar
          if-no-files-found: error

  # Les textures sont dessinées en code (tools/skins) : les PNG commités doivent être ceux que donnent
  # les générateurs, sinon quelqu'un a retouché une image à la main ou oublié de régénérer.
  textures:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/skins/requirements.txt
      - name: install
        run: pip install -r tools/skins/requirements.txt
      # Régénère tout, puis compare les images pixel à pixel : la compression des PNG varie d'une
      # machine à l'autre sans rien changer aux textures.
      - name: regenerate and compare
        run: python tools/skins/check.py

  # L'éditeur web rejoue les mêmes cercles de test (testdata/circles) avec son portage TypeScript.
  editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test
      - name: build
        run: npm run build
